<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/stash-squirrel.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..800,0..100;1,9..144,400..800,0..100&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Baseline social tags. In production these are replaced per-route by
         server/lib/pageMeta.ts before the HTML is sent, so a blog post or help
         article shares with its own title. They live here so the dev server,
         and any route the resolver doesn't know, still share sensibly. -->
    <meta name="description" content="Keep todos, bookmarks and notes together in one list instead of scattered across four apps. Kanban boards, a calendar across every list, and lists you can share. Free to start." />
    <link rel="canonical" href="https://stash-squirrel.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stash Squirrel" />
    <meta property="og:title" content="Stash Squirrel — a nest for your todos, bookmarks, and notes" />
    <meta property="og:description" content="Keep todos, bookmarks and notes together in one list instead of scattered across four apps. Kanban boards, a calendar across every list, and lists you can share. Free to start." />
    <meta property="og:url" content="https://stash-squirrel.com/" />
    <meta property="og:image" content="https://stash-squirrel.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stash Squirrel — a nest for your todos, bookmarks, and notes" />
    <meta name="twitter:description" content="Keep todos, bookmarks and notes together in one list instead of scattered across four apps. Kanban boards, a calendar across every list, and lists you can share. Free to start." />
    <meta name="twitter:image" content="https://stash-squirrel.com/og-image.jpg" />
    <title>Stash Squirrel — a nest for your todos, bookmarks, and notes</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
