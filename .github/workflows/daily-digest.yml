name: Daily digest

# MANUAL ONLY. The digest is driven by the app itself — an hourly timer in
# server/lib/scheduler.ts — and this workflow is kept purely as a way to fire
# a run by hand (a support request, or testing a copy change) without shelling
# into the server. It posts to the app's cron endpoint; no code runs here
# beyond a curl, and production credentials stay on the server.
#
# It used to run on an hourly `schedule:`, and that is why it no longer does:
# over one 18-day sample GitHub delivered 100 of 428 scheduled runs (23%),
# with gaps reaching 7.8 hours. Because the digest only sends to users whose
# local time is inside the send window, a dropped run is not a late email —
# it is no email. Users on UTC+1 were missing 29% of days. Every run reported
# success, because the failures were runs that never happened. On top of that,
# GitHub disables scheduled workflows after 60 days of repository inactivity,
# which is a poor dependency for user-facing mail.
#
# Re-running is always safe: the digest_log table dedupes per user per local
# day, so a manual run alongside the app's own timer cannot double-send.
#
# Setup: add a repository secret CRON_SECRET (Settings → Secrets and variables
# → Actions) matching the CRON_SECRET env var on the DigitalOcean app.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Send to all opted-in users regardless of their local hour (for testing)'
        type: boolean
        default: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily digest
        run: |
          URL="https://stash-squirrel.com/api/cron/daily-digest"
          if [ "${{ inputs.force }}" = "true" ]; then
            URL="$URL?force=1"
          fi
          curl -fsS -X POST "$URL" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 300 \
            -w "\nHTTP %{http_code}\n"
